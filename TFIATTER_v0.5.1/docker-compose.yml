services:
  postgres:
    image: postgres:17-alpine
    container_name: tfiatter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tfiatter}
      POSTGRES_USER: ${POSTGRES_USER:-tfiatter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfiatter_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tfiatter} -d ${POSTGRES_DB:-tfiatter}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tfiatter

  nodered:
    build:
      context: .
      dockerfile: nodered/Dockerfile
    container_name: tfiatter-nodered
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tfiatter}
      POSTGRES_USER: ${POSTGRES_USER:-tfiatter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfiatter_change_me}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-before-public-use}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      GIPHY_WEB_API_KEY: ${GIPHY_WEB_API_KEY:-}
      GIPHY_RATING: ${GIPHY_RATING:-pg-13}
      GIPHY_LANG: ${GIPHY_LANG:-fr}
    ports:
      - "${TFIATTER_PORT:-1880}:1880"
    volumes:
      - uploads_data:/data/public/uploads
    networks:
      - tfiatter

volumes:
  postgres_data:
  uploads_data:

networks:
  tfiatter:
    driver: bridge
